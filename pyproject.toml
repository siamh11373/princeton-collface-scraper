[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "princeton-collface-scraper"
version = "0.1.0"
description = "Resumable, evidence-based export of the authorized Princeton CollFace directory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["playwright==1.62.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.7"]

[project.scripts]
collface-scraper = "collface_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

